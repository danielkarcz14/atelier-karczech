alt: >-
  Návrh moderní kuchyně propojené s obývacím pokojem. Interiér kombinuje bílé
  plochy s dřevěnými prvky a kuchyňským ostrůvkem, který slouží i jako místo pro
  sezení. Cílem bylo vytvořit světlý, jednoduchý a praktický prostor pro
  každodenní používání.  Autor projektu: Bc. Dennis Samuel Gálik
