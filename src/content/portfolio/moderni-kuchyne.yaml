alt: >-
  Návrh moderní kuchyně propojené s jídelní částí. Interiér je laděný do
  světlých odstínů a doplněný dřevěnými prvky, které celý prostor zútulňují.
  Dispozice je navržena tak, aby kuchyně působila vzdušně a zároveň byla
  praktická pro každodenní provoz.  Autor projektu: Bc. Dennis Samuel Gálik
