alt: >-
  Architektonická studie rodinného domu zasazeného do lesního prostředí. Návrh
  vychází z jednoduchého tvaru se sedlovou střechou a tmavšími přírodními
  materiály, které dům přirozeně propojují s okolní krajinou. Součástí řešení je
  také samostatné kryté stání pro auta.  Autor projektu: Bc. Dennis Samuel Gálik
